name: Aegis Commit

on:
  push:
    paths:
      - "examples/aegis-commit-ts/**"
      - ".github/workflows/aegis-commit.yml"
  pull_request:
    paths:
      - "examples/aegis-commit-ts/**"
      - ".github/workflows/aegis-commit.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/aegis-commit-ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: examples/aegis-commit-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level=high
